spring.application.name=nutrition-service
server.port=8084
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://localhost:5433/nutrition_db
spring.datasource.username=bodymatch
spring.datasource.password=YOALAYA
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.bodymatch.nutrition.shared.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model.nutrition=${GEMINI_MODEL_NUTRITION:gemini-2.5-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}

cloud-storage.bucket=${CLOUD_STORAGE_BUCKET:bodymatch-nutrition}
cloud-storage.base-url=${CLOUD_STORAGE_BASE_URL:http://localhost:8084/storage}
cloud-storage.local-path=${CLOUD_STORAGE_LOCAL_PATH:./storage}

logging.level.com.bodymatch.nutrition=DEBUG
